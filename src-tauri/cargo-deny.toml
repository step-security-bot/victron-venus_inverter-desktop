[graph]
# Only check targets we actually build for.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

[advisories]
# ttf-parser (via ab_glyph): unmaintained, no upstream fix yet
# proc-macro-error (transitive dependency): unmaintained, no safe upgrade available
ignore = [
    "RUSTSEC-2026-0192", # ttf-parser: unmaintained (via ab_glyph)
    "RUSTSEC-2024-0370", # proc-macro-error: unmaintained (transitive dependency)
]

[bans]
deny = []
multiple-versions = "allow"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "Unlicense",
]
confidence-threshold = 0.8
include-dev = true

[sources]
allow-git = []
