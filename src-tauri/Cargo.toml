[package]
name = "inverter-dashboard"
version = "2.5.45"
description = "Desktop application for monitoring Victron inverter systems via MQTT"
authors = ["4alvit <4alvit@users.noreply.github.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/victron-venus/inverter-desktop"
homepage = "https://github.com/victron-venus/inverter-desktop"
keywords = ["victron", "inverter", "mqtt", "dashboard", "tauri"]
categories = ["gui", "network-programming"]
readme = "../README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "inverter_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Explicit native-only smoke executable; production entry never invokes it.
native-media-smoke = ["tauri/custom-protocol"]

[[example]]
name = "plugin-media-smoke"
path = "examples/plugin-media-smoke.rs"
required-features = ["native-media-smoke"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"
serde_json = "1"
semver = "1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rumqttc = { package = "rumqttc-v4-next", version = "0.33" }
rustls-native-certs = "0.8"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.13.4", features = ["json"] }
tauri-plugin-log = "2"
log = "0.4.32"
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
rand = "0.10"
aes-gcm = "0.11"
aead = "0.6"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
semver = "1"
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(target_os = "android")'.dependencies]
# Dialog selections are SAF content URIs; this existing transitive dependency
# opens them through Android's ContentResolver instead of treating them as paths.
tauri-plugin-fs = "2"

[target.'cfg(target_os = "ios")'.dependencies]
# Use Security.framework trust evaluation instead of probing Unix PEM paths.
# This version already exists in the lockfile through reqwest.
rustls-platform-verifier = "0.7"

[target.'cfg(target_os = "macos")'.dev-dependencies]
# Exercise the same Apple verifier without changing macOS production TLS.
rustls-platform-verifier = "0.7"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tokio = { version = "1", features = ["process", "io-util"] }
semver = "1"
zip = { version = "8.6", default-features = false }
ed25519-dalek = "3"
sha2 = "0.11.0"
tempfile = "3"
futures-util = "0.3"
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-window-state = "2"
notify-rust = "4.18"
image = { version = "0.25", default-features = false, features = ["png"] }
keyring = "4.1"
auto-launch = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
ab_glyph = "0.2"
mac-notification-sys = "0.6.15"
mac-usernotifications = { version = "0.3.1", path = "vendor/mac-usernotifications", default-features = false }

[target.'cfg(all(unix, not(any(target_os = "android", target_os = "ios"))))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# winreg removed - using autolaunch crate for cross-platform auto-start
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dev-dependencies]
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
