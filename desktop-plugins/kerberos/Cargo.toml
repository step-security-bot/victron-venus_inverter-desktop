[package]
name = "inverter-kerberos-worker"
version = "0.3.1"
edition = "2021"
license = "MIT"
publish = false
description = "Standalone desktop Kerberos camera worker"

[workspace]

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
inverter-worker-protocol = { path = "../worker-protocol" }
inverter-camera-common = { path = "../camera-common" }
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt", "macros", "sync", "time", "net"] }
uuid = { version = "=1.26.1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
