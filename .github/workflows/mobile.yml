name: Mobile

on:
  workflow_call: {}
  # Quality gate owns PR validation; Release pipeline owns main validation.
  workflow_dispatch: {}

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    env:
      INVERTER_BUILD_PROFILE: mobile
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: aarch64-apple-ios
      - name: Get version
        id: version
        run: echo "version=$(grep '^version = ' src-tauri/Cargo.toml | head -1 | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test iOS package version validation
        run: python3 -m unittest discover -s scripts -p test_ios_version.py
      - name: Test mobile native boundary verifier
        run: python3 -m unittest discover -s tests -p test_mobile_native_boundary.py

      - name: Init iOS project
        env:
          SERVER_ADDR_FILE: ''
        run: pnpm tauri ios init --ci
      - name: Ensure Archive config is Release
        run: |
          SCHEME="src-tauri/gen/apple/inverter-dashboard.xcodeproj/xcshareddata/xcschemes/inverter-dashboard_iOS.xcscheme"
          # Tauri may generate ArchiveAction with debug; force release
          sed -i.bak 's/buildConfiguration = "debug"/buildConfiguration = "release"/g' "$SCHEME"
          rm -f "$SCHEME.bak"
          echo "✓ Archive action set to release"
      - name: Disable code signing in Xcode project
        run: |
          python3 -c "
          import re
          p = 'src-tauri/gen/apple/inverter-dashboard.xcodeproj/project.pbxproj'
          with open(p) as f:
              c = f.read()
          c = re.sub(r'DEVELOPMENT_TEAM\s*=\s*\"[^\"]*\";', '', c)
          c = re.sub(r'CODE_SIGN_IDENTITY\s*=\s*\"[^\"]*\";', 'CODE_SIGN_IDENTITY = \"-\";', c)
          # Remove any existing entries first (idempotent)
          c = re.sub(r'\n\s*CODE_SIGNING_ALLOWED\s*=\s*(YES|NO);', '', c)
          c = re.sub(r'\n\s*CODE_SIGNING_REQUIRED\s*=\s*(YES|NO);', '', c)
          # Add fresh entries after each SDKROOT = iphoneos;
          c = re.sub(r'(SDKROOT = iphoneos;)',
              r'\1\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;', c)
          with open(p, 'w') as f:
              f.write(c)
          print('Code signing disabled')
          "
      - name: Configure git for non-interactive GitHub clones
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global --add safe.directory "$PWD"

      - name: Pre-build Rust library for iOS
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-build-ios-library.sh

      - name: Patch Xcode build phase to skip xcode-script if lib exists
        run: python3 scripts/patch_pbxproj.py

      - name: Sync IPHONEOS_DEPLOYMENT_TARGET with installed SDK
        run: |
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          PBPROJ="src-tauri/gen/apple/inverter-dashboard.xcodeproj/project.pbxproj"
          sed -i.bak "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = ${SDK_VERSION};/" "$PBPROJ"
          rm -f "$PBPROJ.bak"
          echo "✓ Deployment target set to $SDK_VERSION"

      - name: Build iOS (unsigned .app)
        env:
          TAURI_APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 scripts/ios_version.py sync \
            src-tauri/gen/apple/inverter-dashboard_iOS/Info.plist --version "$TAURI_APP_VERSION"
          # Clean + custom DerivedData to avoid stale debug caches
          rm -rf "src-tauri/gen/apple/build/DerivedData"
          xcodebuild clean archive \
            -project "src-tauri/gen/apple/inverter-dashboard.xcodeproj" \
            -scheme "inverter-dashboard_iOS" \
            -sdk iphoneos \
            -configuration release \
            -archivePath "src-tauri/gen/apple/build/InverterDesktop.xcarchive" \
            -derivedDataPath "src-tauri/gen/apple/build/DerivedData" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64

      - name: Package .ipa
        env:
          TAURI_APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          XCA="src-tauri/gen/apple/build/InverterDesktop.xcarchive"
          APP_DIR="$XCA/Products/Applications"
          mkdir -p Payload
          cp -R "$APP_DIR/"*.app Payload/
          zip -qr "inverter-dashboard-ios.ipa" Payload
          rm -rf Payload
          python3 scripts/ios_version.py verify inverter-dashboard-ios.ipa --version "$TAURI_APP_VERSION"
          echo "Created inverter-dashboard-ios.ipa"

      - name: Verify packaged iOS excludes desktop features
        run: python3 scripts/check-mobile-native-boundary.py --platform ios --artifact inverter-dashboard-ios.ipa

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inverter-dashboard-ios-v${{ steps.version.outputs.version }}
          path: inverter-dashboard-ios.ipa

    timeout-minutes: 30
  android:
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    env:
      INVERTER_BUILD_PROFILE: mobile
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle
          cache-jdk: false
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-dependency-path: |
            src-tauri/gen/android/**/*.gradle*
            src-tauri/gen/android/**/*.properties
            src-tauri/gen/android/**/gradle.lockfile
            pnpm-lock.yaml
      - name: Test Play signing and native alignment contracts (disposable keys only)
        run: |
          python3 -m unittest discover -s tests -p 'test_play_upload_signing.py' -v
          python3 -m unittest discover -s tests -p 'test_native_alignment.py' -v
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Install required Android SDK components (compileSdk 36, build-tools 34.0.0)
        run: bash scripts/ci-android-install-sdk.sh
      - name: Get version
        id: version
        run: echo "version=$(grep '^version = ' src-tauri/Cargo.toml | head -1 | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev
      - name: Init Android project
        run: pnpm tauri android init --ci
      - name: Test combined Android package graph
        run: python3 -m unittest discover -s tests -p test_android_gradle_graph.py -v
      - name: Fingerprint Android NDK installations
        id: ndk-cache
        shell: bash
        run: |
          # Tauri selects an installed NDK; invalidate native dependencies if any version changes.
          fingerprint=$(sha256sum "$ANDROID_HOME"/ndk/*/source.properties | sha256sum | cut -d' ' -f1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Cache Android Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          key: android-ndk-${{ steps.ndk-cache.outputs.fingerprint }}
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST ANDROID NDK
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build Android
        env:
          ORG_GRADLE_PROJECT_inverterAndroidBothPackages: 'true'
        run: pnpm tauri android build --ci --apk
      - name: Verify 64-bit Android load and RELRO alignment
        run: python3 scripts/android/check_native_alignment.py src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab
      - name: Verify packaged Android excludes desktop features
        run: >-
          python3 scripts/check-mobile-native-boundary.py --platform android --artifact
          src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab
          src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inverter-dashboard-android-v${{ steps.version.outputs.version }}
          path: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab
    timeout-minutes: 45
