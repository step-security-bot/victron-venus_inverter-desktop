name: Google Play upload bundle

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: play-upload-bundle
  cancel-in-progress: false

jobs:
  bundle:
    if: github.ref == 'refs/heads/main' && github.repository == 'victron-venus/inverter-desktop'
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 90
    env:
      INVERTER_BUILD_PROFILE: mobile
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle
          cache-jdk: false
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-dependency-path: |
            src-tauri/gen/android/**/*.gradle*
            src-tauri/gen/android/**/*.properties
            src-tauri/gen/android/**/gradle.lockfile
            pnpm-lock.yaml
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Install Android SDK and pinned NDK r28
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "ndk;28.2.13676358" \
            "platform-tools" 2>&1 | tail -5
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "✓ Android SDK components installed"
      - name: Get version
        id: version
        run: echo "version=$(grep '^version = ' src-tauri/Cargo.toml | head -1 | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev
      - name: Init Android project
        run: pnpm tauri android init --ci
      - name: Fingerprint Android NDK installations
        id: ndk-cache
        shell: bash
        run: |
          # Tauri selects an installed NDK; invalidate native dependencies if any version changes.
          fingerprint=$(sha256sum "$ANDROID_HOME"/ndk/*/source.properties | sha256sum | cut -d' ' -f1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Cache Android Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          key: android-ndk-${{ steps.ndk-cache.outputs.fingerprint }}
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST ANDROID NDK
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build unsigned Play bundle
        run: pnpm tauri android build --ci --aab
      - name: Verify native 16 KB load alignment
        run: python3 scripts/android/check_native_alignment.py src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab
      - name: Verify Play bundle excludes desktop features
        run: >-
          python3 scripts/check-mobile-native-boundary.py --platform android --artifact
          src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab
      - name: Sign and verify with the separate Play upload key
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          python3 scripts/android/sign_play_bundle.py \
            src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab \
            Inverter.Desktop_play-upload.aab
          sha256sum Inverter.Desktop_play-upload.aab > SHA256SUMS
      - name: Upload verified Play bundle only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inverter-desktop-play-upload-v${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            Inverter.Desktop_play-upload.aab
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - name: Remove any interrupted signing key directory
        if: always()
        shell: bash
        run: |
          for directory in "$RUNNER_TEMP"/ott-play-upload-*; do
            if [ -d "$directory" ]; then
              rm -rf -- "$directory"
            fi
          done
