# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: 'npm' # See documentation for possible values
    directory: '/' # Location of package manifests
    schedule:
      interval: 'daily'
    groups:
      commitlint:
        applies-to: version-updates
        patterns:
          - '@commitlint/*'
      # Presets and their Facade API extensions must use the same SDK version.
      univer:
        applies-to: version-updates
        patterns:
          - '@univerjs/*'
    ignore:
      # vue-tsc still requires the TypeScript 6 JavaScript compiler API.
      # https://github.com/vuejs/language-tools/issues/5381#issuecomment-4950412322
      # Remove after a stable supported Vue typechecking path passes both
      # desktop and mobile builds. TypeScript 6 updates remain enabled.
      - dependency-name: typescript
        versions: ['7.x']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily

    groups:
      codeql:
        patterns:
          - github/codeql-action/*
      toolkit-automation:
        applies-to: version-updates
        patterns:
          - victron-venus/venus-os-ci-toolkit/.github/workflows/auto-approve-reusable.yml
          - victron-venus/venus-os-ci-toolkit/.github/workflows/auto-merge.yml
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: daily
